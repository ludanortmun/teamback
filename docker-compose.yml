services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teamback
      POSTGRES_PASSWORD: teamback
      POSTGRES_DB: teamback
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamback"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://teamback:teamback@postgres:5432/teamback?sslmode=disable"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_REDIRECT_URL: "${GOOGLE_REDIRECT_URL:-http://localhost:8080/auth/callback}"
      SESSION_SECRET: "${SESSION_SECRET}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
