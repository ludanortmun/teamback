{{template "layout" .}}

{{define "content"}}
<section class="content-header">
    <h1>Actividades</h1>
    <span class="flex-fill"></span>
    {{if .IsTeacher}}
    <a href="/assignments/new" class="btn">Crear nueva</a>
    {{end}}
</section>

{{if .Assignments}}
<div class="assignment-grid">
    {{range .Assignments}}
    <article class="assignment-card">
        <h2 class="assignment-card__title">{{.Title}}</h2>
        <div class="assignment-card__actions">
            {{if $.IsStudent}}
            <a href="/assignments/{{.ID}}/feedback">Enviar retroalimentación</a>
            {{else}}
            <a href="/assignments/{{.ID}}">Ver respuestas</a>
            {{end}}
        </div>
    </article>
    {{end}}
</div>
{{else}}
<div class="panel empty-state">
    <p>No hay actividades todavía.</p>
</div>
{{end}}
{{end}}
