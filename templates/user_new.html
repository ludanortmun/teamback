{{template "layout" .}}

{{define "content"}}
<section class="content-header">
    <h1>Agregar estudiante</h1>
</section>

{{if .Errors}}
<div class="errors">
    {{range .Errors}}<p class="error">{{.}}</p>{{end}}
</div>
{{end}}

<form class="app-form panel" method="POST" action="/users">
    <div class="form-group">
        <label for="name">Nombre</label>
        <input type="text" id="name" name="name" value="{{if .Name}}{{.Name}}{{end}}" required>
    </div>
    <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" value="{{if .Email}}{{.Email}}{{end}}" required>
    </div>
    <button type="submit" class="btn">Agregar estudiante</button>
</form>
{{end}}
