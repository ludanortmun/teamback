{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teamback</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <a href="/" class="brand">Teamback</a>
        <div class="nav-links">
            {{if .User}}
                <a href="/assignments">Assignments</a>
                {{if .IsTeacher}}
                    <a href="/assignments/new">New Assignment</a>
                    <a href="/users/new">Add Student</a>
                {{end}}
                <a href="/auth/logout" class="btn btn-small">Logout</a>
            {{else}}
                <a href="/login">Login</a>
            {{end}}
        </div>
    </nav>
    <main>
        {{block "content" .}}{{end}}
    </main>
</body>
</html>{{end}}
