{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teamback</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav>
    <a href="/" class="brand">Teamback</a>
    {{if .User}}
    <div class="nav-links">
        <a href="/assignments">Mis actividades</a>
        {{if .IsTeacher}}
        <a href="/users/new">Agregar estudiante</a>
        {{end}}
    </div>
    {{end}}
    <span class="flex-fill"></span>
    <div class="auth-links">
        {{if .User}}
        <span>Bienvenido, {{.User.Name}}</span>
        <a href="/auth/logout" class="btn btn-small">Logout</a>
        {{else}}
        <a href="/login" class="btn btn-small">Login</a>
        {{end}}
    </div>
</nav>
<main>
    {{block "content" .}}{{end}}
</main>
</body>
</html>{{end}}
