{{template "layout" .}}

{{define "content"}}
<section class="content-header">
    <h1>Crear actividad</h1>
</section>

{{if .Errors}}
<div class="errors">
    {{range .Errors}}<p class="error">{{.}}</p>{{end}}
</div>
{{end}}

<form class="app-form panel" method="POST" action="/assignments">
    <div class="form-group">
        <label for="title">Título</label>
        <input type="text" id="title" name="title" value="{{if .Title}}{{.Title}}{{end}}" required>
    </div>
    <div class="form-group">
        <label for="team_emails">Correos del equipo (separados por comas)</label>
        <textarea id="team_emails" name="team_emails" rows="4" required>{{if .TeamEmails}}{{.TeamEmails}}{{end}}</textarea>
    </div>
    <button type="submit" class="btn">Crear actividad</button>
</form>
{{end}}
